<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ERPise Program A</title><style>body{font-family:system-ui;margin:2rem;max-width:58rem}fieldset,section{margin:1rem 0;padding:1rem}button,input,select,textarea{font:inherit;margin:.25rem}#app{display:none}.error{color:#a00}.success{color:#063}pre{white-space:pre-wrap}</style></head><body><main><h1>ERPise Program A</h1><form id="login"><fieldset><legend>Demo sign in</legend><input id="email" type="email" value="demo@erpise.local"><input id="password" type="password" value="demo-only-password"><button>Sign in</button></fieldset></form><p id="status" role="status"></p><div id="app"><p id="context"></p><button id="logout">Sign out</button><section><h2>Catalog, procurement, receiving, warehouse, and finance</h2><div id="products"></div><button id="consent">Record customer consent</button><form id="checkout"><select id="product"></select><input id="quantity" type="number" min="1" value="1"><select id="method"><option value="pickup">Pickup</option><option value="delivery">Delivery</option></select><button>Reserve, pay, and create order</button></form><pre id="checkout-result"></pre></section><section><h2>Reporting and reconciliation</h2><button id="refresh">Refresh reporting and projection</button><button id="replay">Replay projection</button><pre id="orders"></pre></section><section><h2>Support lifecycle and communications</h2><form id="support"><input id="subject" value="Customer support request"><textarea id="details">Program A demo support request</textarea><button>Create, assign, escalate, and resolve case</button></form><pre id="case-result"></pre></section><section><h2>Governed edge reservations</h2><button id="edge">Reserve, confirm, release, and check capacity</button><pre id="edge-result"></pre></section></div></main><script>
const status=document.querySelector('#status'),state={products:[]};const api=async(path,options={})=>{const r=await fetch(path,{credentials:'same-origin',...options}),d=await r.json();if(!r.ok)throw Error(d.error||'request_failed');return d};const note=(t,k='')=>{status.className=k;status.textContent=t};async function refresh(){const [catalog,projection,report]=await Promise.all([api('/api/products'),api('/api/projections/orders'),api('/api/reports/sales')]);state.products=catalog.products;products.innerHTML=state.products.map(p=>`<p><strong>${p.name}</strong>: $${(p.price_cents/100).toFixed(2)}, ${p.available} available</p>`).join('');product.innerHTML=state.products.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');orders.textContent=JSON.stringify({projection:projection.orders,report},null,2)}
login.onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});login.style.display='none';app.style.display='block';context.textContent=`${d.user} is active for ${d.tenant} as ${d.role}.`;await refresh();note('Authenticated Program A session is active.','success')}catch(e){note(e.message,'error')}};logout.onclick=async()=>{await api('/api/auth/logout',{method:'POST'});location.reload()};consent.onclick=async()=>{await api('/api/consent',{method:'POST',headers:{'content-type':'application/json'},body:'{"customer_id":"customer"}'});note('Customer consent recorded.','success')};checkout.onsubmit=async e=>{e.preventDefault();try{const o=await api('/api/orders',{method:'POST',headers:{'content-type':'application/json','Idempotency-Key':crypto.randomUUID()},body:JSON.stringify({product_id:product.value,quantity:Number(quantity.value),customer_id:'customer',fulfillment_method:method.value})});document.querySelector('#checkout-result').textContent=JSON.stringify(o,null,2);await refresh();note('Procurement, receiving, warehouse, finance, and fulfilment completed.','success')}catch(e){note(e.message,'error')}};refresh.onclick=()=>refresh().catch(e=>note(e.message,'error'));replay.onclick=async()=>{await api('/api/events/replay',{method:'POST'});await refresh();note('Projection replay complete.','success')};support.onsubmit=async e=>{e.preventDefault();try{const c=await api('/api/cases',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({subject:subject.value,details:details.value})});const assigned=await api(`/api/cases/${c.case_id}`,{method:'POST',headers:{'content-type':'application/json'},body:'{"status":"assigned","assignee":"demo@erpise.local"}'});const escalated=await api(`/api/cases/${c.case_id}`,{method:'POST',headers:{'content-type':'application/json'},body:'{"status":"escalated"}'});const resolved=await api(`/api/cases/${c.case_id}`,{method:'POST',headers:{'content-type':'application/json'},body:'{"status":"resolved"}'});document.querySelector('#case-result').textContent=JSON.stringify({c,assigned,escalated,resolved},null,2);note('Support case lifecycle completed.','success')}catch(e){note(e.message,'error)}};edge.onclick=async()=>{try{const id=crypto.randomUUID(),h={'content-type':'application/json','Idempotency-Key':id};const reserve=await api('/api/edge/reserve',{method:'POST',headers:h,body:JSON.stringify({reservation_id:id,quantity:1})});const confirm=await api('/api/edge/confirm',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({reservation_id:id})});const release=await api('/api/edge/release',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({reservation_id:id})});const capacity=await api('/api/edge');document.querySelector('#edge-result').textContent=JSON.stringify({reserve,confirm,release,capacity},null,2);note('Governed edge lifecycle completed.','success')}catch(e){note(e.message,'error')}};
</script></body></html>
