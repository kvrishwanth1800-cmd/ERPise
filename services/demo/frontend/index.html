<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ERPise Program A</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 58rem; }
    fieldset, section { margin: 1rem 0; padding: 1rem; }
    button, input, select, textarea { font: inherit; margin: .25rem; }
    #app { display: none; }
    .error { color: #a00; }
    .success { color: #063; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <h1>ERPise Program A</h1>
    <form id="login">
      <fieldset>
        <legend>Demo sign in</legend>
        <input id="email" type="email" value="demo@erpise.local" aria-label="Email">
        <input id="password" type="password" value="demo-only-password" aria-label="Password">
        <button type="submit">Sign in</button>
      </fieldset>
    </form>
    <p id="status" role="status"></p>

    <div id="app">
      <p id="context"></p>
      <button id="logout" type="button">Sign out</button>

      <section>
        <h2>Catalog and order</h2>
        <div id="products"></div>
        <button id="consent" type="button">Record customer consent</button>
        <form id="checkout">
          <select id="product" aria-label="Product"></select>
          <input id="quantity" type="number" min="1" value="1" aria-label="Quantity">
          <select id="method" aria-label="Fulfillment method">
            <option value="pickup">Pickup</option>
            <option value="delivery">Delivery</option>
          </select>
          <button type="submit">Create order</button>
        </form>
        <pre id="checkout-result"></pre>
      </section>

      <section>
        <h2>Reporting and reconciliation</h2>
        <button id="refresh" type="button">Refresh reporting and projection</button>
        <button id="replay" type="button">Replay projection</button>
        <pre id="orders"></pre>
      </section>

      <section>
        <h2>Support lifecycle</h2>
        <form id="support">
          <input id="subject" value="Customer support request" aria-label="Subject">
          <textarea id="details" aria-label="Details">Program A demo support request</textarea>
          <button type="submit">Create, assign, escalate, and resolve case</button>
        </form>
        <pre id="case-result"></pre>
      </section>

      <section>
        <h2>Governed edge reservation</h2>
        <button id="edge" type="button">Reserve, confirm, release, and check capacity</button>
        <pre id="edge-result"></pre>
      </section>
    </div>
  </main>

  <script>
    const $ = (selector) => document.querySelector(selector);
    const status = $('#status');
    const state = { products: [] };

    function note(message, style = '') {
      status.className = style;
      status.textContent = message;
    }

    async function api(path, options = {}) {
      const response = await fetch(path, { credentials: 'same-origin', ...options });
      const body = await response.json();
      if (!response.ok) throw new Error(body.error || 'request_failed');
      return body;
    }

    async function refresh() {
      const [catalog, projection, report] = await Promise.all([
        api('/api/products'),
        api('/api/projections/orders'),
        api('/api/reports/sales')
      ]);
      state.products = catalog.products;
      $('#products').innerHTML = state.products.map((item) =>
        `<p><strong>${item.name}</strong>: $${(item.price_cents / 100).toFixed(2)}, ${item.available} available</p>`
      ).join('');
      $('#product').innerHTML = state.products.map((item) =>
        `<option value="${item.id}">${item.name}</option>`
      ).join('');
      $('#orders').textContent = JSON.stringify({ projection: projection.orders, report }, null, 2);
    }

    $('#login').addEventListener('submit', async (event) => {
      event.preventDefault();
      try {
        const session = await api('/api/auth/login', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ email: $('#email').value, password: $('#password').value })
        });
        $('#login').style.display = 'none';
        $('#app').style.display = 'block';
        $('#context').textContent = `${session.user} is active for ${session.tenant} as ${session.role}.`;
        await refresh();
        note('Authenticated Program A session is active.', 'success');
      } catch (error) {
        note(error.message, 'error');
      }
    });

    $('#logout').addEventListener('click', async () => {
      await api('/api/auth/logout', { method: 'POST' });
      window.location.reload();
    });

    $('#consent').addEventListener('click', async () => {
      try {
        await api('/api/consent', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ customer_id: 'customer' })
        });
        note('Customer consent recorded.', 'success');
      } catch (error) {
        note(error.message, 'error');
      }
    });

    $('#checkout').addEventListener('submit', async (event) => {
      event.preventDefault();
      try {
        const order = await api('/api/orders', {
          method: 'POST',
          headers: { 'content-type': 'application/json', 'Idempotency-Key': crypto.randomUUID() },
          body: JSON.stringify({
            product_id: $('#product').value,
            quantity: Number($('#quantity').value),
            customer_id: 'customer',
            fulfillment_method: $('#method').value
          })
        });
        $('#checkout-result').textContent = JSON.stringify(order, null, 2);
        await refresh();
        note('Order created.', 'success');
      } catch (error) {
        note(error.message, 'error');
      }
    });

    $('#refresh').addEventListener('click', () => refresh().catch((error) => note(error.message, 'error')));
    $('#replay').addEventListener('click', async () => {
      try {
        await api('/api/events/replay', { method: 'POST' });
        await refresh();
        note('Projection replay complete.', 'success');
      } catch (error) {
        note(error.message, 'error');
      }
    });

    $('#support').addEventListener('submit', async (event) => {
      event.preventDefault();
      try {
        const created = await api('/api/cases', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ subject: $('#subject').value, details: $('#details').value })
        });
        const headers = { 'content-type': 'application/json' };
        const assigned = await api(`/api/cases/${created.case_id}`, { method: 'POST', headers, body: JSON.stringify({ status: 'assigned', assignee: 'demo@erpise.local' }) });
        const escalated = await api(`/api/cases/${created.case_id}`, { method: 'POST', headers, body: JSON.stringify({ status: 'escalated' }) });
        const resolved = await api(`/api/cases/${created.case_id}`, { method: 'POST', headers, body: JSON.stringify({ status: 'resolved' }) });
        $('#case-result').textContent = JSON.stringify({ created, assigned, escalated, resolved }, null, 2);
        note('Support case lifecycle complete.', 'success');
      } catch (error) {
        note(error.message, 'error');
      }
    });

    $('#edge').addEventListener('click', async () => {
      try {
        const reservationId = crypto.randomUUID();
        const headers = { 'content-type': 'application/json' };
        const reserve = await api('/api/edge/reserve', { method: 'POST', headers: { ...headers, 'Idempotency-Key': reservationId }, body: JSON.stringify({ reservation_id: reservationId, quantity: 1 }) });
        const confirm = await api('/api/edge/confirm', { method: 'POST', headers, body: JSON.stringify({ reservation_id: reservationId }) });
        const release = await api('/api/edge/release', { method: 'POST', headers, body: JSON.stringify({ reservation_id: reservationId }) });
        const capacity = await api('/api/edge');
        $('#edge-result').textContent = JSON.stringify({ reserve, confirm, release, capacity }, null, 2);
        note('Governed edge lifecycle complete.', 'success');
      } catch (error) {
        note(error.message, 'error');
      }
    });
  </script>
</body>
</html>
