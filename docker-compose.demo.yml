name: erpise-demo
services:
  postgres:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_DB: erpise_demo
      POSTGRES_USER: erpise_demo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo-only-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    command: ["redpanda", "start", "--overprovisioned", "--smp=1", "--memory=1G", "--reserve-memory=0M", "--node-id=0", "--check=false", "--kafka-addr=PLAINTEXT://0.0.0.0:9092", "--advertise-kafka-addr=PLAINTEXT://redpanda:9092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --api-urls localhost:9644"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
  backend:
    build:
      context: .
      dockerfile: services/demo/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://erpise_demo:${POSTGRES_PASSWORD:-demo-only-password}@postgres:5432/erpise_demo
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      EDGE_URL: http://edge:8090
      EDGE_SERVICE_KEY: ${EDGE_SERVICE_KEY:?EDGE_SERVICE_KEY must be set}
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
      edge: {condition: service_healthy}
    ports: ["8080:8080"]
  frontend:
    build: ./services/demo/frontend
    depends_on:
      backend: {condition: service_healthy}
    ports: ["3000:80"]
  edge:
    build:
      context: .
      dockerfile: services/demo/edge/Dockerfile
    environment:
      DATABASE_URL: postgresql://erpise_demo:${POSTGRES_PASSWORD:-demo-only-password}@postgres:5432/erpise_demo
      EDGE_SERVICE_KEY: ${EDGE_SERVICE_KEY:?EDGE_SERVICE_KEY must be set}
    depends_on:
      postgres: {condition: service_healthy}
