name: Workspace quality

on:
  pull_request:
  push:
    branches:
      - main
      - feature/**

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: 0.6.3
      - name: Lint integrated backend with Ruff
        run: uvx ruff check services/demo/backend/integrated --output-format=github
      - name: Sync Python workspace
        run: uv sync --all-groups
      - name: Type-check integrated backend
        id: integrated_mypy
        continue-on-error: true
        run: |
          set -o pipefail
          uv run mypy services/demo/backend/integrated 2>&1 | tee integrated-mypy-output.log
          exit ${PIPESTATUS[0]}
      - name: Print integrated MyPy output
        if: always()
        run: cat integrated-mypy-output.log
      - name: Upload integrated MyPy output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-mypy-output
          path: integrated-mypy-output.log
          if-no-files-found: error
      - name: Preserve integrated MyPy exit code
        if: steps.integrated_mypy.outcome == 'failure'
        run: exit 1
      - name: Type-check Python workspace
        run: uv run mypy services
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Install TypeScript workspace dependencies
        run: env -u CI -u GITHUB_ACTIONS -u BUILD_NUMBER -u RUN_ID -u CONTINUOUS_INTEGRATION pnpm install --no-frozen-lockfile --config.frozen-lockfile=false
      - name: Check TypeScript formatting
        run: pnpm format
      - name: Lint TypeScript workspace
        run: pnpm lint
      - name: Type-check TypeScript workspace
        run: pnpm typecheck
      - name: Test TypeScript workspace
        run: pnpm test
      - name: Test Python workspace
        id: pytest_workspace
        run: |
          set +e
          uv run pytest services -vv --tb=long --maxfail=1 2>&1 | tee pytest-output.log
          PYTEST_EXIT=${PIPESTATUS[0]}
          echo "===== FIRST 200 LINES ====="
          head -n 200 pytest-output.log
          echo "===== LAST 200 LINES ====="
          tail -n 200 pytest-output.log
          echo "===== ERRORS ====="
          grep -n -A 30 -B 10 -E "ERROR|FAILED|ImportError|ModuleNotFoundError|SyntaxError|INTERNALERROR" pytest-output.log || true
          {
          echo "## Pytest diagnostic"
          echo '```text'
          grep -A 40 -B 10 -m 1 -E "ERROR|FAILED|ImportError|ModuleNotFoundError|SyntaxError|INTERNALERROR" pytest-output.log || tail -n 150 pytest-output.log
          echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$PYTEST_EXIT"
      - name: Upload pytest workspace output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.log
          if-no-files-found: error
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - name: Check Rust formatting
        run: cargo fmt --check
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test Rust workspace
        run: cargo test --workspace
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: Check Terraform formatting
        run: terraform -chdir=infrastructure/terraform fmt -check
      - name: Initialize Terraform validation
        run: terraform -chdir=infrastructure/terraform init -backend=false
      - name: Validate Terraform configuration
        run: terraform -chdir=infrastructure/terraform validate
