name: Guarded demo MyPy repair

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/evt-02-transactional-outbox
          fetch-depth: 0

      - name: Apply guarded fetchall correction
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("services/demo/backend/app.py")
          source = path.read_text()
          expected = """                products = [
                    {
                        \"id\": row[0],
                        \"sku\": row[1],
                        \"name\": row[2],
                        \"price_cents\": row[3],
                        \"available\": row[4],
                    }
                    for row in cursor.fetchall()
                ]
"""
          replacement = """                rows = cursor.fetchall()
                products = [
                    {
                        \"id\": row[0],
                        \"sku\": row[1],
                        \"name\": row[2],
                        \"price_cents\": row[3],
                        \"available\": row[4],
                    }
                    for row in (rows or [])
                ]
"""
          if source.count(expected) != 1:
              raise SystemExit("Expected products fetchall pattern must occur exactly once")
          if source.count("for row in cursor.fetchall()") != 1:
              raise SystemExit("Unscoped fetchall iteration count is not exactly one")
          path.write_text(source.replace(expected, replacement))
          PY
          git diff --check
          git diff -- services/demo/backend/app.py

      - uses: astral-sh/setup-uv@v5

      - name: Run focused Python checks
        run: |
          uv sync --all-groups
          uv run ruff check services/demo/backend
          uv run mypy services/demo/backend/app.py
          uv run pytest services/demo/backend/test_app_contract.py

      - name: Commit verified correction and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-demo-mypy.yml
          git add services/demo/backend/app.py
          git diff --cached --check
          git diff --cached -- services/demo/backend/app.py
          git commit -m "fix(demo): guard product cursor rows"
          git push origin HEAD:feature/evt-02-transactional-outbox
