name: Integration execution diagnostics

on:
  push:
    branches:
      - feature/**

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.4-alpine
        env:
          POSTGRES_DB: erpise
          POSTGRES_USER: erpise
          POSTGRES_PASSWORD: change-me-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erpise -d erpise"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redpanda:
        image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
        ports:
          - 19092:19092
        options: >-
          --health-cmd "rpk cluster health --api-urls localhost:9644"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
        env:
          REDPANDA_AUTO_CREATE_TOPICS_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: 0.6.3
      - name: Sync Python workspace
        run: uv sync --all-groups
      - name: Record integration environment
        env:
          TEST_DATABASE_URL: postgresql://erpise:change-me-local-only@localhost:5432/erpise
          TEST_REDPANDA_BOOTSTRAP_SERVERS: localhost:19092
        run: |
          docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          uv run python -c "import os, kafka; print(f'kafka-python={kafka.__version__}'); print(f'TEST_DATABASE_URL={os.environ[\"TEST_DATABASE_URL\"]}'); print(f'TEST_REDPANDA_BOOTSTRAP_SERVERS={os.environ[\"TEST_REDPANDA_BOOTSTRAP_SERVERS\"]}')"
      - name: Run exact CI integration-test command
        id: pytest
        continue-on-error: true
        env:
          TEST_DATABASE_URL: postgresql://erpise:change-me-local-only@localhost:5432/erpise
          TEST_REDPANDA_BOOTSTRAP_SERVERS: localhost:19092
        run: |
          set -o pipefail
          uv run pytest services 2>&1 | tee pytest-execution.log
          exit ${PIPESTATUS[0]}
      - name: Upload pytest execution output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-execution-output
          path: pytest-execution.log
          if-no-files-found: error
      - name: Return pytest exit code
        if: steps.pytest.outcome == 'failure'
        run: exit 1
